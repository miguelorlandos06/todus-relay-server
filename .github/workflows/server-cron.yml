name: Run Go Relay Server (Cron)

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build Server Binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o todus_relay_vps .
      - name: Create .env file
        run: |
          echo "PROXY_SHARED_SECRET=${{ secrets.PROXY_SHARED_SECRET }}" > .env
          echo "TODUS_BASE_URL=${{ secrets.TODUS_BASE_URL }}" >> .env
          echo "TODUS_VERIFY_TLS=1" >> .env
          echo "POLL_INTERVAL=0.05" >> .env
          echo "QUEUE_POLL_INTERVAL=0.5" >> .env
          echo "MAX_SESSIONS=64" >> .env
      - name: Run Relay Server
        run: |
          chmod +x todus_relay_vps
          ./todus_relay_vps &
          SERVER_PID=$!
          while kill -0 $SERVER_PID 2>/dev/null; do sleep 60; done
